name: Backend CI/CD

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.x"
  APP_DIR: /root/application/backend

concurrency:
  group: lms-backend-production
  cancel-in-progress: true

jobs:
  build:
    name: Build TypeScript backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests if available
        run: npm run test --if-present

      - name: Verify JavaScript output
        run: test -d dist

  deploy:
    name: Deploy backend to VPS
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/deploy') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd "${{ env.APP_DIR }}"
            test -f .env || { echo "Missing ${{ env.APP_DIR }}/.env on the VPS."; exit 1; }
            git fetch --prune origin deploy
            git checkout deploy
            git reset --hard origin/deploy
            docker compose up -d --build --remove-orphans backend
            docker compose ps backend

            for attempt in $(seq 1 12); do
              health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' lms-backend 2>/dev/null || true)"
              if [ "$health" = "healthy" ]; then
                exit 0
              fi
              echo "Waiting for lms-backend health check (current: ${health:-container not found})..."
              sleep 5
            done

            echo "Deployment failed: lms-backend did not become healthy."
            docker compose logs --tail=100 backend
            exit 1